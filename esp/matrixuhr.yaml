# ESPHome configuration for the matrix clock (stc8-matrixclock) on an ESP8285/ESP8266.
# Wiring and notes: docs/ESP.md. Live protocol: docs/PROTOCOL.md.
# Needs clock firmware from 2026-11-13 or later (lines up to 254 bytes,
# replies `pruef` / `zu lang`).
#
# Secrets (secrets.yaml, see secrets.yaml.example): wifi_ssid, wifi_password,
# matrixuhr__encryption_key, matrixuhr__ap_password.

substitutions:
  name: matrixuhr
  friendly_name: Matrixuhr

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret matrixuhr__encryption_key
  actions:
    # Appointment: monat/jahr = 0 -> every month/every year, stunde = -1 -> all day
    - action: termin_setzen
      variables:
        monat: int
        tag: int
        jahr: int
        stunde: int
        minute: int
        ton: bool
        termin_text: string
      then:
        - script.execute:
            id: uhr_cmd
            cmd: !lambda |-
              char buf[64];
              if (stunde < 0)
                snprintf(buf, sizeof(buf), "Y+%02d%02d%02d9999%d",
                         monat, tag, jahr % 100, ton ? 1 : 0);
              else
                snprintf(buf, sizeof(buf), "Y+%02d%02d%02d%02d%02d%d",
                         monat, tag, jahr % 100, stunde, minute, ton ? 1 : 0);
              return std::string(buf) + termin_text;
            warten: true
    - action: termine_alle_loeschen
      then:
        - script.execute: { id: uhr_cmd, cmd: "Y-", warten: true }
    - action: termin_loeschen
      variables:
        platz: int
      then:
        - script.execute:
            id: uhr_cmd
            cmd: !lambda 'char b[16]; snprintf(b, sizeof(b), "Yd%03d", platz); return std::string(b);'
            warten: true
    - action: termin_anzeigen
      variables:
        platz: int
      then:
        - script.execute:
            id: uhr_cmd
            cmd: !lambda 'char b[16]; snprintf(b, sizeof(b), "Yl%03d", platz); return std::string(b);'
            warten: true
    - action: termine_zaehlen
      then:
        - script.execute: { id: uhr_cmd, cmd: "Y?", warten: true }


ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Matrixuhr Fallback Hotspot
    password: !secret matrixuhr__ap_password
captive_portal:


esp8266:
  board: esp8285        # for an ESP8266EX with 4 MB: esp12e


text_sensor:
  - platform: template
    id: uhr_letzte
    name: "Letzte Antwort"
  - platform: template
    id: uhr_status
    name: "Status roh (v)"
    entity_category: diagnostic


logger:
  baud_rate: 0          # UART0 belongs to the clock – logs only via Wi-Fi
  level: DEBUG

uart:
  id: uhr
  tx_pin: GPIO1         # -> 1 kOhm -> P3.0 (chip pin 18)
  rx_pin: GPIO3         # <- 1 kOhm / 2 kOhm to GND <- P3.1 (chip pin 19), clock TxD is 5 V
  baud_rate: 921600
  rx_buffer_size: 512

time:
  - platform: homeassistant
    id: ha_zeit
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - script.execute: zeit_stellen

globals:
  - id: uhr_antwort
    type: std::string
    restore_value: false

script:
  # Sends a command as in docs/PROTOCOL.md and reads the reply.
  # warten=false: only wait for '!' (e.g. melody, the reply only comes after 8 s).
  # Replies `pruef` (check failed, bytes lost) -> repeat; `zu lang` (more than
  # 254 bytes) -> give up. No reply -> repeat (up to 3 attempts in total).
  # Every run ends by publishing "command -> reply" to "Letzte Antwort".
  - id: uhr_cmd
    mode: queued
    max_runs: 10
    parameters:
      cmd: string
      warten: bool
    then:
      - lambda: |-
          id(uhr_antwort) = "";
          uint8_t sum = 0;
          for (char c : cmd) sum += (uint8_t) c;
          const uint8_t ff[8] = {0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF};
          std::vector<uint8_t> body(cmd.begin(), cmd.end()); // command
          body.push_back(0x40 + (sum & 0x3F));               // check character
          body.push_back('\n');

          for (int versuch = 1; versuch <= 3; versuch++) {
            uint8_t b;
            id(uhr_antwort) = "";
            while (id(uhr).available()) id(uhr).read_byte(&b);  // empty the buffer

            // sync in chunks of 8, stop as soon as '!' arrives (keeps the display dark for less time)
            bool ack = false;
            int ff_gesendet = 0;
            while (!ack && ff_gesendet < 200) {
              id(uhr).write_array(ff, sizeof(ff));
              id(uhr).flush();
              ff_gesendet += sizeof(ff);
              while (id(uhr).available()) {
                id(uhr).read_byte(&b);
                if (b == '!') { ack = true; break; }
              }
            }
            if (!ack) {
              ESP_LOGW("uhr", "%s: kein Sync-Ack (Versuch %d)", cmd.c_str(), versuch);
              continue;
            }

            // Command in one go: the clock firmware since 2026-11-13 takes the
            // line in its UART interrupt, no pause per byte needed.
            id(uhr).write_array(body.data(), body.size());
            id(uhr).flush();
            ESP_LOGD("uhr", "Sync nach %d x 0xFF bestätigt", ff_gesendet);
            if (!warten) {
              id(uhr_antwort) = "(gesendet)";
              ESP_LOGI("uhr", "%s -> (gesendet)", cmd.c_str());
              return;
            }

            bool cr = false;
            std::string zeile;
            uint32_t start = millis();
            while (millis() - start < 150) {
              while (id(uhr).available()) {
                id(uhr).read_byte(&b);
                if (b >= 0x20 && b < 0x7F) { zeile += (char) b; cr = false; }
                else if (b == '\r') { cr = true; }
                else if (b == '\n' && cr && !zeile.empty()) {
                  id(uhr_antwort) = zeile;
                  if (zeile == "zu lang") {
                    ESP_LOGE("uhr", "%s: zu lang (max. 254 Byte)", cmd.c_str());
                    return;                                   // repeating does not help
                  }
                  if (zeile == "pruef") {
                    ESP_LOGW("uhr", "%s: Pruefzeichenfehler (Versuch %d)", cmd.c_str(), versuch);
                    break;                                    // repeat
                  }
                  ESP_LOGI("uhr", "%s -> %s", cmd.c_str(), zeile.c_str());
                  return;
                } else { zeile.clear(); cr = false; }      // display garbage
              }
              if (id(uhr_antwort) == "pruef") break;
              App.feed_wdt();
              yield();
            }
            if (id(uhr_antwort) == "pruef") continue;
            ESP_LOGW("uhr", "%s: keine Antwort (Versuch %d)", cmd.c_str(), versuch);
          }
      - lambda: |-
          std::string a = id(uhr_antwort);
          if (a.empty()) a = "(keine Antwort)";
          std::string c = cmd.size() > 40 ? cmd.substr(0, 40) + "..." : cmd;
          id(uhr_letzte).publish_state(c + " -> " + a);

  - id: zeit_stellen
    then:
      - if:
          condition:
            lambda: 'return id(ha_zeit).now().is_valid();'
          then:
            - script.execute:
                id: uhr_cmd
                cmd: !lambda |-
                  auto t = id(ha_zeit).now();
                  char buf[16];
                  snprintf(buf, sizeof(buf), "s%02d%02d%02d", t.hour, t.minute, t.second);
                  return std::string(buf);
                warten: true
            - script.execute:
                id: uhr_cmd
                cmd: !lambda |-
                  auto t = id(ha_zeit).now();
                  int wt = (t.day_of_week + 5) % 7 + 1;   // ESPHome 1=Sun -> clock 1=Mon
                  char buf[16];
                  snprintf(buf, sizeof(buf), "D%02d%02d%02d%d",
                           t.day_of_month, t.month, t.year % 100, wt);
                  return std::string(buf);
                warten: true

  - id: alarm_senden
    then:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "a%02d%02d%d",
                     id(alarm_zeit).hour, id(alarm_zeit).minute,
                     id(alarm_an).state ? 1 : 0);
            return std::string(buf);
          warten: true

text:
  - platform: template
    name: "Befehl (roh)"
    entity_category: diagnostic
    mode: text
    max_length: 254             # bytes; umlauts count 2
    optimistic: true
    set_action:
      - script.execute: { id: uhr_cmd, cmd: !lambda 'return x;', warten: true }

  - platform: template
    name: "Lauftext"
    mode: text
    max_length: 253             # + 'l' = 254 bytes; umlauts count 2
    optimistic: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "l" + x;'
          warten: true

number:
  # Countdown: set minutes and seconds, then press "Countdown starten".
  - platform: template
    id: cd_min
    name: "Countdown Minuten"
    mode: box
    min_value: 0
    max_value: 99
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
  - platform: template
    id: cd_sek
    name: "Countdown Sekunden"
    mode: box
    min_value: 0
    max_value: 59
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0

select:
  # Option names as in the clock's own menu (W_* tables in firmware/uhr2.c).
  - platform: template
    id: sel_hell
    name: "Helligkeit"
    options: ["Auto", "1", "2", "3", "4", "5", "6", "7", "8"]
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "H" + to_string(id(sel_hell).index_of(x).value_or(0));'
          warten: true

  - platform: template
    id: alarm_melodie
    name: "Alarm-Melodie"
    options: ["Pip", "Steigend", "Triller", "T3 1 kHz", "T3 520 Hz"]
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "N" + to_string(id(alarm_melodie).index_of(x).value_or(0) + 1);'
          warten: true

  - platform: template
    id: sel_raetsel
    name: "Alarm-Rätsel"
    options: ["aus", "Code", "Rechnen"]
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "U" + to_string(id(sel_raetsel).index_of(x).value_or(0));'
          warten: true

  - platform: template
    id: sel_anim
    name: "Animation"
    options: ["aus", "Schieben", "Pixel", "Spalten", "Oben", "Mitte", "Rollen", "Auf-Ab", "Wischen"]
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "Vw" + to_string(id(sel_anim).index_of(x).value_or(0));'
          warten: true

  - platform: template
    id: sel_ziff
    name: "Ziffern-Effekt"
    options: ["aus", "Aufbau", "Fallen", "Pixel", "Auf-Ab", "Mitte"]
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "Vz" + to_string(id(sel_ziff).index_of(x).value_or(0));'
          warten: true

  - platform: template
    id: sel_punkt
    name: "Doppelpunkt-Effekt"
    options: ["Mitte", "Blenden", "Konstant", "Auf-Ab", "Sekunde"]
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "Vd" + to_string(id(sel_punkt).index_of(x).value_or(0) + 1);'
          warten: true

  - platform: template
    id: sel_info
    name: "Info-Rotation"
    options: ["5 s", "10 s", "30 s", "1 min", "2 min", "aus"]
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "Vi" + to_string(id(sel_info).index_of(x).value_or(0));'
          warten: true

  - platform: template
    id: sel_thema
    name: "Theme"
    options: ["H:M:S", "HH:MM", "HH:MM s"]
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "Vt" + to_string(id(sel_thema).index_of(x).value_or(0) + 1);'
          warten: true

  - platform: template
    id: sel_led
    name: "Rück-LEDs"
    options: ["aus", "konstant", "Ton", "Atmen"]
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "Vl" + to_string(id(sel_led).index_of(x).value_or(0));'
          warten: true

  - platform: template
    id: sel_schrift
    name: "Schrift"
    options: ["1", "2", "3"]
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "Vs" + to_string(id(sel_schrift).index_of(x).value_or(0) + 1);'
          warten: true

  - platform: template
    id: sel_mikro
    name: "Mikro-Schwelle"
    options: ["20", "30", "40", "50", "60", "70", "80", "90"]
    initial_option: "50"
    optimistic: true
    restore_value: true
    set_action:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "Vm" + to_string(id(sel_mikro).index_of(x).value_or(3) + 2);'
          warten: true

datetime:
  - platform: template
    id: alarm_zeit
    name: "Alarm-Zeit"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "06:30:00"
    on_value:
      - script.execute: alarm_senden

switch:
  - platform: template
    id: alarm_an
    name: "Alarm"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: alarm_senden
    on_turn_off:
      - script.execute: alarm_senden

  - platform: template
    name: "Nachtmodus"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: { id: uhr_cmd, cmd: "Q1", warten: true }
    turn_off_action:
      - script.execute: { id: uhr_cmd, cmd: "Q0", warten: true }

  - platform: template
    name: "Lichtorgel"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: { id: uhr_cmd, cmd: "O1", warten: true }
    turn_off_action:
      - script.execute: { id: uhr_cmd, cmd: "O0", warten: true }

button:
  - platform: template
    name: "Zeit stellen"
    on_press:
      - script.execute: zeit_stellen
  - platform: template
    name: "Testalarm"
    on_press:
      - script.execute: { id: uhr_cmd, cmd: "U9", warten: false }
  - platform: template
    name: "Display aus"
    on_press:
      - script.execute: { id: uhr_cmd, cmd: "Q2", warten: true }
  - platform: template
    name: "Melodie probehören"
    on_press:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda 'return "M" + to_string(id(alarm_melodie).active_index().value_or(0) + 1);'
          warten: false
  - platform: template
    name: "Lichtorgel-Welle"
    on_press:
      - script.execute: { id: uhr_cmd, cmd: "O2", warten: true }
  - platform: template
    name: "Countdown starten"
    on_press:
      - script.execute:
          id: uhr_cmd
          cmd: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "C%02d%02d", (int) id(cd_min).state, (int) id(cd_sek).state);
            return std::string(b);
          warten: true
  - platform: template
    name: "Countdown stoppen"
    on_press:
      - script.execute: { id: uhr_cmd, cmd: "C0000", warten: true }

sensor:
  - platform: template
    id: uhr_temp
    name: "Temperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 2
    update_interval: never
  # From the `v` reply, see docs/PROTOCOL.md
  - platform: template
    id: uhr_licht
    name: "Lichtsensor"
    icon: mdi:brightness-6
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never        # raw ADC 0-4095, high = dark
  - platform: template
    id: uhr_stufe
    name: "Helligkeitsstufe"
    icon: mdi:brightness-percent
    accuracy_decimals: 0
    update_interval: never        # 1-8, the level currently shown
  - platform: template
    id: uhr_mic
    name: "Mikrofon-Spitze"
    icon: mdi:microphone
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never        # highest mic value since the previous `v`

interval:
  - interval: 5min
    then:
      - script.execute: { id: uhr_cmd, cmd: "T", warten: true }
      - script.wait: uhr_cmd
      - lambda: |-
          auto v = parse_number<float>(id(uhr_antwort));
          if (v.has_value()) id(uhr_temp).publish_state(*v);
  - interval: 60s
    then:
      - script.execute: { id: uhr_cmd, cmd: "v", warten: true }
      - script.wait: uhr_cmd
      - lambda: |-
          // e.g. "3366 8 touch 278/287 255/256 nacht 0/0/0 weck mic/touch 0/0 spitze 0"
          const std::string &a = id(uhr_antwort);
          int licht, stufe;
          if (sscanf(a.c_str(), "%d %d touch", &licht, &stufe) != 2) return;
          id(uhr_status).publish_state(a);
          id(uhr_licht).publish_state(licht);
          id(uhr_stufe).publish_state(stufe);
          auto p = a.find("spitze ");
          if (p != std::string::npos) id(uhr_mic).publish_state(atoi(a.c_str() + p + 7));
